
name: Customer Purchase ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train customer purchase model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t customer-purchase-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name customer-purchase-ml-container \
            -p 5000:5000 \
            customer-purchase-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs customer-purchase-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Age": 25,
              "Annual_Income": 50000,
              "Spending_Score": 70,
              "Experience": 2,
              "Gender": "Female",
              "City": "Hyderabad",
              "Education": "Graduate",
              "Marital_Status": "Single",
              "Occupation": "Student"
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction_code"'
          echo "Prediction API test passed."

      - name: Show Docker container logs
        if: always()
        run: docker logs customer-purchase-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f customer-purchase-ml-container || true

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp customer_purchase_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Customer Purchase Prediction API\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload ML release package
        uses: actions/upload-artifact@v4
        with:
          name: customer-purchase-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-purchase-ml-artifacts
          path: |
            customer_purchase_model.pkl
            metrics.json
            data/customer_data_500_records.csv
          if-no-files-found: error
          retention-days: 7
