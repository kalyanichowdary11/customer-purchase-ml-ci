
name: Customer Purchase ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train customer purchase model
        run: python train_model.py
      - name: Check ML quality gate
        run: python quality_gate.py

      
      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

   
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp customer_purchase_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Customer Purchase Prediction API\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt


      - name: Upload ML release package
        uses: actions/upload-artifact@v4
        with:
          name: customer-purchase-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-purchase-ml-artifacts
          path: |
            customer_purchase_model.pkl
            metrics.json
            data/customer_data_500_records.csv
          if-no-files-found: error
          retention-days: 7


