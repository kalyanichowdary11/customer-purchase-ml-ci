
name: Build, Test and Publish Customer Purchase ML

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: customer-purchase-ml

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name customer-purchase-ci \
            -p 5000:5000 \
            $IMAGE_NAME:ci

      - name: Test API endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "API health check passed."
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done

          echo "API health check failed."
          docker logs customer-purchase-ci
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f customer-purchase-ci || true

      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY" \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Tag tested image
        run: |
          docker tag "$IMAGE_NAME:ci" "$IMAGE_ID:latest"
          docker tag "$IMAGE_NAME:ci" "$IMAGE_ID:sha-${{ github.sha }}"

      - name: Push tested image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${{ github.sha }}"
